<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8"/>
      <stop offset="100%" stop-color="#0085a8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#21262d" stroke-width="1" opacity="0.6">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- Go gopher silhouette accent (simplified) -->
  <g transform="translate(95, 95)">
    <rect width="6" height="50" fill="#00ADD8" rx="2"/>
    <rect y="60" width="6" height="30" fill="#00ADD8" rx="2" opacity="0.5"/>
  </g>

  <!-- Project name -->
  <text x="130" y="140" font-size="84" font-weight="800" fill="#ffffff" letter-spacing="-2">pi-go</text>

  <!-- Slogan -->
  <text x="132" y="190" font-size="26" fill="#8b949e" letter-spacing="0.5">A minimal coding agent in Go</text>

  <!-- Accent underline -->
  <rect x="132" y="210" width="120" height="4" fill="url(#accent)" rx="2"/>

  <!-- Three core numbers (the hook) -->
  <g transform="translate(132, 290)">
    <!-- Number 1 -->
    <text font-size="72" font-weight="800" fill="#00ADD8">2</text>
    <text x="0" y="50" font-size="20" fill="#8b949e">third-party deps</text>

    <!-- Number 2 -->
    <text x="280" font-size="72" font-weight="800" fill="#ffffff">9</text>
    <text x="280" y="50" font-size="20" fill="#8b949e">tools</text>

    <!-- Number 3 -->
    <text x="480" font-size="72" font-weight="800" fill="#ffffff">43k</text>
    <text x="480" y="50" font-size="20" fill="#8b949e">lines of Go</text>

    <!-- Number 4 -->
    <text x="740" font-size="72" font-weight="800" fill="#ffffff">1</text>
    <text x="740" y="50" font-size="20" fill="#8b949e">loop, 1 protocol</text>
  </g>

  <!-- Tagline -->
  <text x="132" y="460" font-size="22" fill="#c9d1d9">One loop. Nine tools. One protocol. Pure stdlib — except the browser terminal.</text>

  <!-- Repo URL -->
  <text x="132" y="500" font-size="20" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, monospace">github.com/yosukeno/pi-go</text>

  <!-- Footer badges -->
  <g transform="translate(132, 555)" font-size="14" font-family="ui-monospace, SFMono-Regular, monospace">
    <rect width="110" height="28" fill="#21262d" stroke="#30363d" rx="14"/>
    <text x="55" y="19" fill="#8b949e" text-anchor="middle">Apache-2.0</text>

    <rect x="125" width="90" height="28" fill="#21262d" stroke="#30363d" rx="14"/>
    <text x="170" y="19" fill="#8b949e" text-anchor="middle">Go 1.26+</text>

    <rect x="230" width="120" height="28" fill="#21262d" stroke="#30363d" rx="14"/>
    <text x="290" y="19" fill="#8b949e" text-anchor="middle">Kimi · GLM</text>
  </g>

  <!-- Right side: stylized dependency bars (echo the comparison chart) -->
  <g transform="translate(960, 280)" font-size="13">
    <text x="0" y="-15" fill="#8b949e" font-weight="600">DIRECT DEPENDENCIES</text>

    <text x="-130" y="15" fill="#c9d1d9" text-anchor="end">pi-go</text>
    <rect x="0" y="0" width="6" height="20" fill="#00ADD8" rx="2"/>
    <text x="15" y="15" fill="#00ADD8" font-weight="700">2</text>

    <text x="-130" y="55" fill="#c9d1d9" text-anchor="end">opencode</text>
    <rect x="0" y="40" width="90" height="20" fill="#484f58" rx="2"/>
    <text x="100" y="55" fill="#8b949e" font-weight="700">30</text>

    <text x="-130" y="95" fill="#c9d1d9" text-anchor="end">aider</text>
    <rect x="0" y="80" width="258" height="20" fill="#484f58" rx="2"/>
    <text x="268" y="95" fill="#8b949e" font-weight="700">86</text>
  </g>
</svg>
